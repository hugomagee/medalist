[project]
name = "medalist"
version = "0.1.0"
description = "Autonomous ML competition agent harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "optuna>=3.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "matplotlib>=3.8",
]

[project.scripts]
medalist = "core.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["sklearn.*", "lightgbm.*", "xgboost.*", "catboost.*", "optuna.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[[tool.mypy.overrides]]
module = "experiments.*"
ignore_errors = true
